server {
    listen 80;
    server_name nginx.main.demo-annai-static-site.jp1.amazee.io;

    user 1000;

    root /app/src;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        allow all;
        setsebool -P httpd_can_network_connect 1;
    }

    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}
