docker-compose-yaml: docker-compose.yml

project: static-site

tasks:
  post-rollout:
    - run:
        name: Testing the environment
        command: wget -q -O - localhost:8080 -S
        service: nginx

environments:
  main:
    routes:
      - nginx:
        - "staticsite.docker.amazee.io":
            tls-acme: true
            insecure: Redirect
