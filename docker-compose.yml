version: '3'

services:
  nginx:
    build:
      context: .
      dockerfile: lagoon/nginx.dockerfile
    labels:
      lagoon.type: nginx
      lagoon.name: nginx
      lagoon.project: static-site
      amazeeio: true
      amazeeio.type: nginx
    environment:
      AMAZEEIO: true
      AMAZEEIO_URL: staticsite.docker.amazee.io
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - amazeeio-network
      - default

networks:
  amazeeio-network:
    external: true
