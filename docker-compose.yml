version: '3'

x-environment:
  &default-environment
    LAGOON_ROUTE: &default-url http://demo-annai-static-site.docker.amazee.io

x-user:
  &default-user
    user: '1000'

services:
  nginx:
    build:
      context: .
      dockerfile: lagoon/nginx.dockerfile
    labels:
      lagoon.type: nginx
      lagoon.name: nginx
      lagoon.project: static-site
      amazeeio: true
      amazeeio.type: nginx
    << : *default-user
    ports:
      - "8080"
    environment:
      << : *default-environment
      AMAZEEIO: true
      AMAZEEIO_URL: nginx.main.demo-annai-static-site.jp1.amazee.io
      LAGOON_LOCALDEV_URL: *default-url
    volumes:
      - ./src:/app/src:rw
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - amazeeio-network
      - default

networks:
  amazeeio-network:
    external: true
